<aside class="side"><h1>BILLAR HOLD</h1><nav id="nav"></nav><div id="cloud">● Conectando…</div><div id="hoy"></div></aside>
<main id="main"></main><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),dlg=$('#dlg'),KEY='billar_v2';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'S/ '+n.toFixed(2),r2=n=>Math.round(n*100)/100;
const clock=ms=>{const s=Math.floor(ms/1000);return[s/3600|0,(s/60|0)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')};
const COL=['#d9534f','#c98a14','#3f84cf','#8e5bd0','#2a9a70','#d9692a','#c04b8f','#5f7080'];
let S=null,tab='mesas',cur=null,sel=null,voidAsk=false;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.mesas)S={mesas:[1,2,3,4].map(i=>({id:i,name:'Mesa '+i,rate:10,start:null,items:[],players:[]})),prods:[{n:'Agua',p:2},{n:'Gaseosa',p:4},{n:'Cerveza',p:9},{n:'Papas',p:3}],ventas:[],cfg:{frac:15},nid:5,pid:1};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.FB)FB.saveState()};
const MAXM=4;
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let dday=null;
const trim=()=>{let c=false;while(S.mesas.length>MAXM){const i=S.mesas.map(m=>!m.start&&!m.items.length&&!m.players.some(p=>p.paid)).lastIndexOf(true);if(i<0)break;S.mesas.splice(i,1);c=true}return c};
if(trim())try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
const cm=()=>S.mesas.find(m=>m.id==cur);
const el=m=>m.start?(m.stop||Date.now())-m.start:0;
const bill=m=>{const c=Math.ceil(el(m)/60000/S.cfg.frac)*S.cfg.frac;return m.stop?Math.max(c,S.cfg.frac):Math.max(c,m.plan||0)};
const pl=n=>n==60?'1 hora':n==30?'media hora':n+' min';
const over=m=>!m.stop&&m.plan&&el(m)>m.plan*60000;
const disp=m=>{if(!m.start)return clock(0);if(m.stop||!m.plan)return clock(el(m));const r=m.plan*60000-el(m);return r>=0?clock(r):'+'+clock(-r)};
const dlab=m=>!m.start?'Tiempo':m.stop?'Jugado':!m.plan?'Tiempo':over(m)?'Tiempo extra':'Quedan';
const tcost=m=>m.monto!=null?m.monto:bill(m)/60*m.rate;
const tshare=(m,p)=>m.players.some(x=>x.id==m.payer)?(p.id==m.payer?tcost(m):0):tcost(m)/Math.max(1,m.players.length);
const pitems=(m,p)=>m.items.filter(i=>i.pid==p.id);
const pic=(m,p)=>pitems(m,p).reduce((a,i)=>a+i.p*i.q,0);
const pamt=(m,p)=>p.paid?p.amt:(p.custom!=null?p.custom:r2(tshare(m,p)+pic(m,p)));
const due=m=>m.players.filter(p=>!p.paid).reduce((a,p)=>a+pamt(m,p),0);
const icost=m=>m.items.reduce((a,i)=>a+i.p*i.q,0);
const today=()=>S.ventas.filter(v=>new Date(v.t).toDateString()==new Date().toDateString());
const ci=m=>m.players.indexOf(m.players.find(p=>p.id==sel));
const nt=m=>(m.turnos||[]).length+1;
const wname=(m,t)=>{const p=m.players.find(x=>x.id==t.pid);return p?p.n:t.nm};
const tally=m=>{const o={};(m.turnos||[]).forEach(t=>{const n=wname(m,t);o[n]=(o[n]||0)+1});return Object.entries(o).map(([k,v])=>k+' '+v).join(' · ')};
const addPl=m=>{const p={id:S.pid++,n:'Jugador '+(m.players.length+1),paid:false};m.players.push(p);return p};
const reset=m=>{delete m.monto;m.start=null;m.plan=null;m.stop=null;m.payer=null;m.items=[];m.players=[];m.turnos=[]};

function pool(m){
  const b=[['#e8c21a',45,35],['#2d5fd0',52,44],['#c8262b',58,52],['#7a3b9c',64,38],['#111',70,48],['#e07b19',58,30],['#1f9d55',46,55],['#8c1d1d',66,60]];
  return `<div class="pool"><i class="pk" style="left:-10px;top:-10px"></i><i class="pk" style="right:-10px;top:-10px"></i><i class="pk" style="left:-10px;bottom:-10px"></i><i class="pk" style="right:-10px;bottom:-10px"></i><i class="pk" style="left:calc(50% - 8px);top:-11px"></i><i class="pk" style="left:calc(50% - 8px);bottom:-11px"></i>${m.start?b.map(x=>`<i class="bl" style="background:${x[0]};left:${x[1]}%;top:${x[2]}%"></i>`).join('')+'<i class="bl" style="background:#fff;left:22%;top:46%"></i>':''}</div>`;
}
function seat(m,p){const n=pitems(m,p).reduce((a,i)=>a+i.q,0),k=m.players.indexOf(p);
  return `<span class="seat ${p.paid?'paid':''}" style="background:${COL[k%8]};${m.payer==p.id?'box-shadow:0 0 0 3px var(--brass)':''}" title="${esc(p.n)}${n?' · '+n+' consumo(s)':''}">${esc(p.n.trim().slice(0,2).toUpperCase())}${n?`<em>${n}</em>`:''}</span>`}

function render(){

    T.push({n:T.length+1,pid:p.id,nm:p.n,t:now,d:now-(last?last.t:m.start)});save();detail(m.id);render()}
  else if(a=='undowin'){const m=cm();(m.turnos||[]).pop();save();detail(m.id);render()}
  else if(a=='stop'){const m=S.mesas.find(x=>x.id==id);m.stop=Date.now();save();render();if(dlg.open)detail(m.id)}
  else if(a=='addpl'){const m=S.mesas.find(x=>x.id==(id||cur));sel=addPl(m).id;save();render();if(dlg.open){cur=m.id;detail(m.id)}}
  else if(a=='rmpl'){const m=cm();m.players=m.players.filter(p=>p.id!=pid);save();render();detail(m.id)}
  else if(a=='auto'){const m=cm(),p=m.players.find(x=>x.id==pid);if(p)delete p.custom;save();detail(m.id);render()}
  else if(a=='sel'){sel=pid;detail(cur)}
  else if(a=='close')dlg.close();
  else if(a=='new')editor(null);
  else if(a=='edit')editor(cur);
  else if(a=='saveM'){const n=$('#en').value.trim()||'Mesa',r=+$('#er').value||0;
    if(id){const m=S.mesas.find(x=>x.id==id);m.name=n;m.rate=r}else S.mesas.push({id:S.nid++,name:n,rate:r,start:null,items:[],players:[]});
    save();dlg.close();render()}
  else if(a=='delM'){S.mesas=S.mesas.filter(x=>x.id!=cur);save();dlg.close();render()}
  else if(a=='add'){const m=cm(),p=S.prods[i];if((p.s|0)<=0)return;p.s=(p.s|0)-1;const x=m.items.find(t=>t.n==p.n&&t.p==p.p&&t.pid==sel);x?x.q++:m.items.push({n:p.n,p:p.p,q:1,pid:sel});save();detail(m.id);render()}
  else if(a=='less'){const m=cm(),it=m.items[i],pr=S.prods.find(x=>x.n==it.n&&x.p==it.p);if(pr)pr.s=(pr.s|0)+1;if(--it.q<=0)m.items.splice(i,1);save();detail(m.id);render()}
  else if(a=='pay'){const m=cm(),p=m.players.find(x=>x.id==pid),t=pamt(m,p);
    const v={t:Date.now(),mesa:m.name+' · '+p.n,min:m.start?bill(m):0,tc:p.custom!=null?r2(t-pic(m,p)):r2(tshare(m,p)),ic:r2(pic(m,p)),tot:t,pay:b.dataset.p};S.ventas.push(v);if(window.FB)FB.venta(v);
    p.paid=true;p.amt=t;p.pay=b.dataset.p;
    if(m.players.every(x=>x.paid)){reset(m);save();dlg.close();render()}else{save();detail(m.id);render()}}
  else if(a=='void'){if(!voidAsk){voidAsk=true;b.textContent='Toca otra vez para anular';return}
    const m=cm();m.items.forEach(it=>{const p=m.players.find(x=>x.id==it.pid);if(p&&p.paid)return;const pr=S.prods.find(x=>x.n==it.n&&x.p==it.p);if(pr)pr.s=(pr.s|0)+it.q});reset(m);save();dlg.close();render()}
  else if(a=='delv'){if(!confirm('¿Borrar este cobro del historial?'))return;
    const k=S.ventas.findIndex(v=>id?v._id==id:v.t==+b.dataset.t);if(k>=0)S.ventas.splice(k,1);
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(id&&window.FB)FB.delVenta(id);render()}
  else if(a=='day'){dday=b.dataset.d;cmo=null;render()}
  else if(a=='cmo'){cmo=b.dataset.m;render()}
  else if(a=='addp'){const n=$('#pn').value.trim(),p=+$('#pp').value,q=Math.max(0,parseInt($('#ps').value)||0);if(!n||!(p>=0))return;const ex=S.prods.find(x=>x.n==n&&x.p==p);if(ex)ex.s=(ex.s|0)+q;else S.prods.push({n,p,s:q});save();render()}
  else if(a=='delp'){S.prods.splice(i,1);save();render()}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b)});
document.addEventListener('change',e=>{
  if(e.target.id=='drange'){drange=+e.target.value||14;render()}
  else if(e.target.id=='dday'){dday=e.target.value||dkey(Date.now());cmo=null;render()}

  else if(e.target.dataset.sidx!==undefined){const p=S.prods[+e.target.dataset.sidx];if(p){p.s=Math.max(0,parseInt(e.target.value)||0);save();render()}}
  else if(e.target.id=='payer'){const m=cm();m.payer=+e.target.value||null;save();detail(m.id);render()}
  else if(e.target.dataset.pid&&e.target.tagName=='INPUT'){const m=cm(),p=m.players.find(x=>x.id==e.target.dataset.pid);if(p){p.n=e.target.value.trim()||p.n;save();detail(m.id);render()}}
});
setInterval(()=>{
  S.mesas.forEach(m=>{if(!m.start)return;const t=$('#t'+m.id);if(t){t.textContent=disp(m);t.style.color=over(m)?'var(--danger)':'';$('#c'+m.id).textContent=money(due(m))}});
  if(dlg.open&&$('#dt')){const m=cm();if(m){$('#dt').textContent=disp(m);$('#dl').textContent=dlab(m);$('#dtot').textContent=money(due(m));m.players.forEach(p=>{const x=$('#pa'+p.id);if(!x)return;if(x.tagName=='INPUT'){if(p.custom==null&&document.activeElement!==x)x.value=pamt(m,p).toFixed(2)}else x.textContent=money(pamt(m,p))})}}
},1000);
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);
const typing=()=>{const a=document.activeElement;return a&&/INPUT|SELECT/.test(a.tagName)&&(dlg.contains(a)||$('#main').contains(a))};
let lastErr=null;
window.APP={
  getState(){const{ventas,...r}=S;return JSON.parse(JSON.stringify(r))},
  getVentas:()=>S.ventas,
  applyRemote(d){
    const K=['mesas','prods','cfg','nid','pid'];
    if(K.every(k=>canon(S[k])===canon(d[k])))return;
    if(typing())return;
    K.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});if(trim())save();
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    render();
    if(dlg.open&&$('#dt')){if(cm())detail(cur);else dlg.close()}
  },
  applyVentas(a){
    S.ventas=a;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(typing()||dlg.open){$('#hoy').innerHTML=`Ventas de hoy<b>${money(today().reduce((x,v)=>x+v.tot,0))}</b>`}else render();
  },
  setCloud(ok,e){const c=$('#cloud');lastErr=ok?null:e;
    c.textContent=ok?'● Guardado en la nube':'● Sin nube'+(e&&e.code?' ('+e.code+')':'');
    c.style.color=ok?'#7fd9a8':'#ff9c93';if(e)console.error(e)}
};
$('#cloud').onclick=()=>{if(lastErr)alert('No se pudo guardar en Firebase: '+(lastErr.code||lastErr.message||lastErr)+'\n\nRevisa en Firebase > Firestore Database > Reglas que permitan leer y escribir en "billar" y "ventas", y que la base de datos esté creada.')};
render();

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,onSnapshot,collection,addDoc,query,orderBy,limit,writeBatch,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({
  apiKey:"AIzaSyB5AEbDRjVgcrcmlK42OC_emi1p6-WYVt8",
  authDomain:"billard-40941.firebaseapp.com",
  projectId:"billard-40941",
  storageBucket:"billard-40941.firebasestorage.app",
  messagingSenderId:"531433862763",
  appId:"1:531433862763:web:8d8cfa247ca5baa01be32e"
});
let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(app)}
const ref=doc(db,'billar','estado'),colV=collection(db,'ventas');
let want=0,done=0,timer=null,migrated=false;
const fail=e=>APP.setCloud(false,e);
window.FB={
  saveState(){want++;clearTimeout(timer);timer=setTimeout(async()=>{const w=want;
    try{await setDoc(ref,APP.getState());done=w;APP.setCloud(true)}catch(e){done=w;fail(e)}},300)},
  venta(v){addDoc(colV,v).then(r=>{v._id=r.id;APP.setCloud(true)}).catch(fail)},
  delVenta(id){deleteDoc(doc(colV,id)).then(()=>APP.setCloud(true)).catch(fail)}
};
onSnapshot(ref,snap=>{
  if(!snap.exists()){if(!snap.metadata.fromCache)FB.saveState();return}
  if(snap.metadata.hasPendingWrites||done<want)return;
  APP.applyRemote(snap.data());APP.setCloud(true);
},fail);
onSnapshot(query(colV,orderBy('t','desc'),limit(500)),snap=>{
  if(snap.empty){
    if(!snap.metadata.fromCache&&!migrated){migrated=true;const l=APP.getVentas().slice(-400);
      if(l.length){const b=writeBatch(db);l.forEach(({_id,...v})=>b.set(doc(colV),v));b.commit().catch(fail)}}
    return}
  migrated=true;APP.applyVentas(snap.docs.map(d=>({...d.data(),_id:d.id})).reverse());
},fail);
