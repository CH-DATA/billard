<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9efeb;--sf:#fff;--ink:#13211a;--mut:#5d6f65;--ln:#cbd8d0;--felt:#1b6a4d;--fon:#f4f1e6;--brass:#e3b04b;--danger:#b3372f;--ok:#1b6a4d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1713;--sf:#15241d;--ink:#e6efe9;--mut:#8fa399;--ln:#26372e;--felt:#1f7a58;--danger:#e0675e;--ok:#5cc79a}}
:root[data-theme="dark"]{--bg:#0d1713;--sf:#15241d;--ink:#e6efe9;--mut:#8fa399;--ln:#26372e;--felt:#1f7a58;--danger:#e0675e;--ok:#5cc79a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card.run{border-color:var(--brass)}
.card .top{display:flex;justify-content:space-between;align-items:baseline}
.clk{font:700 34px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.02em}
.tot{font:700 22px 'Barlow Condensed',sans-serif}
.mut{color:var(--mut);font-size:14px}
.mid{display:flex;justify-content:space-between;align-items:flex-end}

let cajaOpen=false,omesaPre=null;
const cajaHoy=()=>S.pedidos.filter(v=>v.mesa==CAJA&&dkey(v.t)==dkey(Date.now())).reduce((a,v)=>a+v.tot,0);
function cajaCard(){return `<article class="card" style="cursor:default"><div class="top"><b>${CAJA}</b><span class="mut">Hoy: ${money(cajaHoy())}</span></div>
    <img class="barimg" style="object-fit:contain;background:#fff" src="${CAJAIMG}" alt="Consumo en caja">
    <div class="row"><button data-a="cajapick">Registrar consumo</button></div></article>`}
const cajaList=q=>{q=nrm(q||'');const r=S.prods.map((p,i)=>({p,i})).filter(x=>!q||nrm(x.p.n).includes(q));
  return r.map(({p,i})=>`<li><span>${esc(p.n)}</span><span>${money(p.p)}</span><span class="mut">Stock: ${p.s|0}</span><button data-a="cajasel" data-i="${i}" ${(p.s|0)<=0?'disabled':''}>Pedido</button></li>`).join('')||'<li class="mut">No hay productos con ese nombre.</li>'};
let cajaMsg='',cajaI=-1;
const cajaTot=()=>{const p=S.prods[cajaI],q=Math.max(1,parseInt(($('#cqty')||{}).value)||1);return p?r2(p.p*q):0};
function cajaHist(){const h=S.pedidos.filter(v=>v.mesa==CAJA&&dkey(v.t)==dkey(Date.now())).slice(-5).reverse();
  return h.length?`<h3>Registrados hoy</h3><ul>${h.map(v=>`<li><span>${v.q} × ${esc(v.prod)}</span><span>${esc(v.nom)}</span><span>${v.pay}</span><b>${money(v.tot)}</b></li>`).join('')}</ul>`:''}
function cajaPick(){cajaOpen=true;cajaI=-1;if(!cajaPick.l){cajaPick.l=1;dlg.addEventListener('close',()=>{cajaOpen=false});
  dlg.addEventListener('input',e=>{if(e.target.id=='cajaq')$('#cajal').innerHTML=cajaList(e.target.value);else if(e.target.id=='cqty')$('#ctot').textContent=money(cajaTot())});
  dlg.addEventListener('keydown',e=>{if(e.target.id=='cajaq'&&e.key=='Enter'){e.preventDefault();const x=$('#cajal button:not([disabled])');if(x)x.click()}})}
  dlg.innerHTML=`<div class="dh"><h2>${CAJA}</h2><button class="ghost" data-a="cajaclose">Cerrar</button></div>
  ${cajaMsg?`<div class="ok">${cajaMsg}</div>`:''}<p class="mut">Hoy: <b>${money(cajaHoy())}</b>. Escribe lo que va a consumir y elige el producto.</p>
  <div class="fld"><label for="cajaq">Buscar producto</label><input id="cajaq" type="search" placeholder="Ej. cerveza, agua, papas..." autocomplete="off"></div>
  <ul id="cajal">${cajaList('')}</ul>${cajaHist()}`;cajaMsg='';
  if(!dlg.open)dlg.showModal();setTimeout(()=>{const q=$('#cajaq');if(q)q.focus()},50)}
function cajaForm(i){const p=S.prods[i];if(!p)return;cajaI=i;
  dlg.innerHTML=`<div class="dh"><h2>${CAJA}</h2><button class="ghost" data-a="cajaclose">Cerrar</button></div>
  <h3>${esc(p.n)}</h3><p class="mut">${money(p.p)} c/u · quedan ${p.s|0}</p>
  <div class="fld"><label for="cnom">Nombre del cliente</label><input id="cnom" placeholder="Ej. Carlos" autocomplete="off"></div>
  <div class="fld"><label for="cqty">Cantidad</label><div class="row" style="margin-top:0"><button class="ghost" data-a="cq" data-d="-1" aria-label="Menos">−</button><input id="cqty" type="number" min="1" step="1" value="1" style="width:90px;text-align:center"><button class="ghost" data-a="cq" data-d="1" aria-label="Más">+</button></div></div>
  <div class="fld"><label for="cpay">Forma de pago</label><select id="cpay"><option>Efectivo</option><option>Yape</option><option>Tarjeta</option></select></div>
  <div class="pp"><div class="row" style="justify-content:space-between;margin:0;font-size:1.15em"><b>Total a pagar</b><b id="ctot">${money(p.p)}</b></div></div>
  <div class="row" style="margin-top:12px"><button data-a="csave">Registrar consumo</button><button class="ghost" data-a="cajaback">Volver</button></div>`;
  setTimeout(()=>{const q=$('#cnom');if(q)q.focus()},50)}
function cajaSave(){const p=S.prods[cajaI];if(!p)return;const q=Math.max(1,parseInt($('#cqty').value)||1);
  if(q>(p.s|0)){alert('Solo quedan '+(p.s|0)+' de '+p.n);return}
  const c=+p.c||0,v={t:Date.now(),nom:$('#cnom').value.trim()||'Sin nombre',mesa:CAJA,prod:p.n,p:p.p,c,q,tot:r2(p.p*q),gan:r2((p.p-c)*q),pay:$('#cpay').value};
  p.s=(p.s|0)-q;S.pedidos.push(v);save();if(window.FB)FB.pedido(v);render();
  cajaMsg='✔ Registrado: '+q+' × '+esc(p.n)+' · '+money(v.tot)+' · '+v.pay;cajaPick()}
const COL=['#d9534f','#c98a14','#3f84cf','#8e5bd0','#2a9a70','#d9692a','#c04b8f','#5f7080'];

const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);
const typing=()=>{const a=document.activeElement;return a&&/INPUT|SELECT/.test(a.tagName)&&(dlg.contains(a)||$('#main').contains(a))};
let lastErr=null;
window.APP={
  getState(){const{ventas,pedidos,...r}=S;return JSON.parse(JSON.stringify(r))},
  getVentas:()=>S.ventas,
  applyRemote(d){
    const K=['mesas','prods','cfg','nid','pid','clientes','cid'];
    if(K.every(k=>canon(S[k])===canon(d[k])))return;
    if((d.rev||0)<(S.rev||0)){if(window.FB)FB.saveState();return}
    if(typing())return;
    K.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});S.rev=d.rev||S.rev||0;if(trim()|ensureBar())save();
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    render();
    if(dlg.open&&$('#dt')){if(cm())detail(cur);else dlg.close()}
  },
  applyVentas(a){
    S.ventas=a;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(typing()||dlg.open){$('#hoy').innerHTML=hoyHtml()}else render();
  },
  applyPedidos(a){
    S.pedidos=a;$('#hoy').innerHTML=hoyHtml();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(!typing()&&!dlg.open&&!$('#odlg').open&&!$('#edlg').open)render();
  },
  getPedidos:()=>S.pedidos,
  setCloud(ok,e){const c=$('#cloud');lastErr=ok?null:e;
    c.textContent=ok?'● Guardado en la nube':'● Sin nube'+(e&&e.code?' ('+e.code+')':'');
    c.style.color=ok?'#7fd9a8':'#ff9c93';if(e)console.error(e)}
};
$('#cloud').onclick=()=>{if(lastErr)alert('No se pudo guardar en Firebase: '+(lastErr.code||lastErr.message||lastErr)+'\n\nRevisa en Firebase > Firestore Database > Reglas que permitan leer y escribir en "billar" y "ventas", y que la base de datos esté creada.')};
render();

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,onSnapshot,collection,addDoc,query,orderBy,limit,writeBatch,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({
  apiKey:"AIzaSyB5AEbDRjVgcrcmlK42OC_emi1p6-WYVt8",
  authDomain:"billard-40941.firebaseapp.com",
  projectId:"billard-40941",
  storageBucket:"billard-40941.firebasestorage.app",
  messagingSenderId:"531433862763",
  appId:"1:531433862763:web:8d8cfa247ca5baa01be32e"
});
let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(app)}
const ref=doc(db,'billar','estado'),colV=collection(db,'ventas'),colP=collection(db,'pedidos');
let want=0,done=0,timer=null,migrated=false,dirty=false;
const fail=e=>APP.setCloud(false,e);
window.FB={
  saveState(){want++;dirty=true;clearTimeout(timer);timer=setTimeout(async()=>{const w=want;
    try{await setDoc(ref,APP.getState());done=w;if(w===want)dirty=false;APP.setCloud(true)}catch(e){done=w;fail(e);clearTimeout(timer);timer=setTimeout(()=>FB.saveState(),5000)}},300)},
  venta(v){addDoc(colV,v).then(r=>{v._id=r.id;APP.setCloud(true)}).catch(fail)},
  delVenta(id){deleteDoc(doc(colV,id)).then(()=>APP.setCloud(true)).catch(fail)},
  pedido(v){addDoc(colP,v).then(r=>{v._id=r.id;APP.setCloud(true)}).catch(fail)},
  delPedido(id){deleteDoc(doc(colP,id)).then(()=>APP.setCloud(true)).catch(fail)}
};
onSnapshot(ref,snap=>{
  if(!snap.exists()){if(!snap.metadata.fromCache)FB.saveState();return}
  if(dirty||snap.metadata.hasPendingWrites||done<want)return;
  APP.applyRemote(snap.data());APP.setCloud(true);
},fail);
onSnapshot(query(colV,orderBy('t','desc'),limit(500)),snap=>{
  if(snap.empty){
    if(!snap.metadata.fromCache&&!migrated){migrated=true;const l=APP.getVentas().slice(-400);
      if(l.length){const b=writeBatch(db);l.forEach(({_id,...v})=>b.set(doc(colV),v));b.commit().catch(fail)}}
    return}
  migrated=true;APP.applyVentas(snap.docs.map(d=>({...d.data(),_id:d.id})).reverse());
},fail);
let migP=false;
onSnapshot(query(colP,orderBy('t','desc'),limit(500)),snap=>{
  if(snap.empty){
    if(!snap.metadata.fromCache&&!migP){migP=true;const l=APP.getPedidos().slice(-400);
      if(l.length){const b=writeBatch(db);l.forEach(({_id,...v})=>b.set(doc(colP),v));b.commit().catch(fail)}}
    return}
  migP=true;APP.applyPedidos(snap.docs.map(d=>({...d.data(),_id:d.id})).reverse());
},fail);
</script></body></html>
